# Isolated disposable authentication test database. Never mounts development data.
name: dhaka-tesla-auth-tests
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: dtp_test
      POSTGRES_PASSWORD: dtp_test_only
      POSTGRES_DB: dhaka_tesla_auth_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtp_test -d dhaka_tesla_auth_test"]
      interval: 2s
      timeout: 3s
      retries: 20
