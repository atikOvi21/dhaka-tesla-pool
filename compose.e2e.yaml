# Disposable full-stack browser test environment, using images built by compose.yaml.
name: dhaka-tesla-auth-e2e
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: dtp_test
      POSTGRES_PASSWORD: dtp_test_only
      POSTGRES_DB: dhaka_tesla_auth_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtp_test -d dhaka_tesla_auth_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  init:
    extends:
      file: compose.yaml
      service: init
    image: dhaka-tesla-pool-init
    environment:
      DATABASE_URL: postgresql://dtp_test:dtp_test_only@db:5432/dhaka_tesla_auth_test
      SEED_DEMO: "true"
  api:
    extends:
      file: compose.yaml
      service: api
    image: dhaka-tesla-pool-api
    environment:
      DATABASE_URL: postgresql://dtp_test:dtp_test_only@db:5432/dhaka_tesla_auth_test
      AUTH_ORIGINS: http://localhost:8081
      SESSION_COOKIE_SECURE: "false"
  web:
    image: dhaka-tesla-pool-web
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
